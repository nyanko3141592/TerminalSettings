# ==========================
# tmux configuration
# ==========================

# --- General ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g history-limit 10000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g focus-events on

# --- Prefix ---
# C-b → C-a に変更
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Window ---
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Pane navigation (vim-like) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Pane resize ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Copy mode (vi) ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# --- Reload config ---
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# --- Status bar ---
set -g status-position bottom
set -g status-style "bg=colour235,fg=colour250"
set -g status-left "#[fg=colour234,bg=colour39,bold] #S #[fg=colour39,bg=colour235] "
set -g status-left-length 30
set -g status-right-length 80
set -g status-right "#[fg=colour39]pane#[fg=colour245] |H -V x kill #[fg=colour39]win#[fg=colour245] c new & kill n/p move #[fg=colour250] %H:%M "
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=colour234,bg=colour39,bold] #I:#W "

# --- Pane border ---
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour238"
set -g pane-border-status top
set -g pane-border-format " #{?pane_active,#[fg=colour39 bold]●,#[fg=colour245]○} #{pane_index}:#{pane_current_command} #{s|$HOME|~|:pane_current_path} "

# --- Inactive pane dim ---
# 非アクティブペインの文字を薄くする（背景透過に影響なし）
set -g window-style "fg=colour245"
set -g window-active-style "fg=terminal"

# --- Plugins (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# セッション自動復元
set -g @continuum-restore 'on'
# 15分ごとに自動保存
set -g @continuum-save-interval '15'

# Initialize TPM (この行は必ず末尾に置く)
run '~/.tmux/plugins/tpm/tpm'
